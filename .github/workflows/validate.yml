name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/validate.py
      - run: npx -y @anthropic-ai/claude-code@2.1.263 plugin validate . --strict
      - run: npx -y @anthropic-ai/claude-code@2.1.263 plugin validate plugins/kimono --strict
